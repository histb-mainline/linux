%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/hisilicon,hisi-crg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon SoC Clock and Reset Generator (CRG) module

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The CRG module provides clock and reset signals to various modules within
  the SoC.

properties:
  compatible:
    oneOf:
      - const: hisilicon,hi3519-crg
      - items:
          - enum:
              - hisilicon,hi3516cv300-sysctrl
              - hisilicon,hi3798cv200-sysctrl
              - hisilicon,hi3798mv100-sysctrl
          - const: syscon
      - items:
          - enum:
              - hisilicon,hi3516cv300-crg
              - hisilicon,hi3798cv200-crg
              - hisilicon,hi3798mv100-crg
          - const: syscon
          - const: simple-mfd

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1
    description:
      Each clock is assigned an identifier and client nodes use that
      identifier to specify the clock they consume. The identifiers of a
      given SoC are listed in the matching dt-bindings/clock header.

  '#reset-cells':
    const: 2
    description:
      A reset signal is controlled by a bit in a register of the CRG module.
      The first cell is the register offset relative to the base address, the
      second cell the bit index in that register.

  reset-controller:
    type: object
    description:
      The GMAC PHY reset of the Hi3798CV200 core CRG, described with the
      generic syscon reset binding.

required:
  - compatible
  - reg
  - '#clock-cells'
  - '#reset-cells'

unevaluatedProperties: false

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: hisilicon,hi3798cv200-crg
    then:
      required:
        - reset-controller
    else:
      properties:
        reset-controller: false

examples:
  - |
    clock-reset-controller@12010000 {
        compatible = "hisilicon,hi3519-crg";
        reg = <0x12010000 0x10000>;
        #clock-cells = <1>;
        #reset-cells = <2>;
    };
