%YAML 1.2
---
$id: http://devicetree.org/schemas/display/hisilicon/hisilicon,hi3798mv200-vdp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV200 VDP display engine

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The VDP block composites the graphics layers onto a display channel and drives
  the timing of that channel. This driver exposes DHD0, the HD channel wired to
  the on-chip HDMI transmitter, whose pixel clock the two blocks share.

properties:
  compatible:
    const: hisilicon,hi3798mv200-vdp

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description:
          HD channel clock. The transmitter is fed from the same clock, so the
          two blocks cannot disagree about the pixel clock.
      - description:
          Gate of the display channel's bus (CRG54 bit 0).
      - description:
          Gate of the channel's timing encoder (CRG54 bit 3). A reset request
          only reaches the block while it is clocked, so the driver enables
          these before it pulses the reset below.

  clock-names:
    items:
      - const: pix
      - const: bus
      - const: sdate

  resets:
    maxItems: 1
    description:
      The block's own soft reset (CRG211 bit 29), named vdp. It has to be
      released before any clock feeding the register file is raised, because an
      access with the HD domain clocked while that request is still held locks
      the bus instead of returning a value.

  reset-names:
    items:
      - const: vdp

  hisilicon,crg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle of the clock generator. The driver reaches one more field there
      by hand, the VOU reset request in CRG54 bit 30, whose register file is
      only reachable with that bit raised, and which the reset framework cannot
      describe because the bit means the opposite of what its assert does.

  memory-region:
    maxItems: 1
    description:
      Phandle to a node describing memory to be used for the framebuffer. If not
      present, the framebuffer may be located anywhere in memory. The channel
      takes a single base address and has no MMU, so frame buffers also have to
      be physically contiguous.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Pixel output of the channel, connected to the input of the HDMI
          transmitter.

    required:
      - port@0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - hisilicon,crg
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/hisilicon,hi3798mv200-crg.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    display@f8cc0000 {
        compatible = "hisilicon,hi3798mv200-vdp";
        reg = <0xf8cc0000 0x10000>;
        interrupts = <GIC_SPI 90 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&crg HI3798MV200_VO_HD>, <&crg HI3798MV200_VO_BUS>,
                 <&crg HI3798MV200_VO_SDATE>;
        clock-names = "pix", "bus", "sdate";
        resets = <&crg 0x34c 29>;
        reset-names = "vdp";
        hisilicon,crg = <&crg>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;

                vdp_out_hdmi: endpoint {
                    remote-endpoint = <&hdmi_in_vdp>;
                };
            };
        };
    };
