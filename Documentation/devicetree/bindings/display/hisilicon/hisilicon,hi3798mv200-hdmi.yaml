%YAML 1.2
---
$id: http://devicetree.org/schemas/display/hisilicon/hisilicon,hi3798mv200-hdmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV200 HDMI transmitter

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The on-chip HDMI transmitter takes the pixel stream of one VDP display
  channel and serialises it onto a TMDS link. It is made of two register
  windows, the digital blocks (encoder, video path, packetiser, DDC master)
  and the analog PHY, and it needs two divider fields and the resets of the
  SoC clock generator, which is why it also refers to that block.

properties:
  compatible:
    const: hisilicon,hi3798mv200-hdmi

  reg:
    minItems: 2
    maxItems: 2

  reg-names:
    items:
      - const: tx
      - const: phy

  clocks:
    items:
      - description:
          HD channel pixel clock. The channel and this transmitter run off the
          same clock, so neither can disagree about the pixel clock.
      - description: Gate of the TMDS clock the PHY is driven from.

  clock-names:
    items:
      - const: pix
      - const: tmds

  resets:
    maxItems: 4
    description:
      The resets of the transmitter's blocks in the clock generator, being the
      controller bus, the controller, the spread spectrum block and the TMDS
      clock path. The PHY's own request bit is not listed here, because the
      driver pulses it as part of a divider change.

  "#sound-dai-cells":
    const: 0

  hisilicon,crg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle of the clock generator, which the driver reaches as a syscon
      because the two divider fields it owns there are picked from the mode and
      cannot be expressed as a clock rate.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Pixel input of the transmitter, connected to the output of the VDP
          display channel it feeds.

    required:
      - port@0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - hisilicon,crg
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/hisilicon,hi3798mv200-crg.h>

    hdmi: hdmi@8ce0000 {
        compatible = "hisilicon,hi3798mv200-hdmi";
        reg = <0x8ce0000 0x20000>, <0x8d30000 0x1000>;
        reg-names = "tx", "phy";
        clocks = <&crg HI3798MV200_VO_HD>, <&crg HI3798MV200_HDMITX_PHY_TMDS_CLK>;
        clock-names = "pix", "tmds";
        resets = <&crg 0x10c 6>, <&crg 0x10c 7>, <&crg 0x10c 9>,
                 <&crg 0x110 5>;
        hisilicon,crg = <&crg>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;

                hdmi_in_vdp: endpoint {
                    remote-endpoint = <&vdp_out_hdmi>;
                };
            };
        };
    };
