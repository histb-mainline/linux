%YAML 1.2
---
$id: http://devicetree.org/schemas/display/hisilicon/hisilicon,hi3798mv100-vdp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV100 VDP v2 display engine

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The VDP block composites the graphics layers onto a display channel and drives
  the timing of that channel. This driver exposes DHD0, the HD channel wired to
  the on-chip HDMI transmitter, whose pixel clock the two blocks share.

  hi3716cv200 uses the same register file for its output channel; the one block
  whose layout differs is the GP0 zoom engine, where cv200 keeps both horizontal
  offsets in a single register and takes both ratios in 4.12 fixed point.

properties:
  compatible:
    enum:
      - hisilicon,hi3798mv100-vdp
      - hisilicon,hi3716cv200-vdp

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description:
          HD channel clock. The transmitter is fed from the same clock, so the
          two blocks cannot disagree about the pixel clock.
      - description:
          The rest of the display channel's gates (CRG54 bits 6:0 apart from
          vo_hd_cken, which is the channel clock above). A reset request only
          reaches the block while it is clocked, so the driver enables these
          before it pulses the reset below.

  clock-names:
    items:
      - const: pix
      - const: vo

  resets:
    maxItems: 1
    description:
      VOU soft reset (CRG54 bit 30). The driver pulses it before it configures
      the block, so the display controller comes up from its reset defaults
      instead of whatever an earlier stage left behind.

  memory-region:
    maxItems: 1
    description:
      Phandle to a node describing memory to be used for the framebuffer. If not
      present, the framebuffer may be located anywhere in memory. The channel
      takes a single base address and has no MMU, so frame buffers also have to
      be physically contiguous.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Pixel output of the channel, connected to the input of the HDMI
          transmitter.

    required:
      - port@0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/hisilicon,hi3798mv100-crg.h>

    display@8cc0000 {
        compatible = "hisilicon,hi3798mv100-vdp";
        reg = <0x8cc0000 0x10000>;
        interrupts = <90 4>;
        clocks = <&crg HI3798MV100_VO_HD_CLK>, <&crg HI3798MV100_VO_CLK>;
        clock-names = "pix", "vo";
        resets = <&crg 0xd8 30>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;

                vdp_out_hdmi: endpoint {
                    remote-endpoint = <&hdmi_in_vdp>;
                };
            };
        };
    };
