%YAML 1.2
---
$id: http://devicetree.org/schemas/media/hisilicon,hix5hd2-ir.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hix5hd2 Infrared Receiver

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The receiver turns the demodulated carrier back into symbols and hands them
  to the CPU, which runs the protocol decoder over them.

  Bringing the block up takes its clock plus, on some SoCs, one more bit in a
  system controller register; hisilicon,power-syscon points at that register
  file and the driver sets the bit there.  Hi3798CV200 and Hi3798MV200 keep
  that bit inside the same window as the clock gate the clock provider already
  covers, so they need no phandle.

allOf:
  - $ref: rc.yaml#

properties:
  compatible:
    enum:
      - hisilicon,hix5hd2-ir
      - hisilicon,hi3796cv300-ir

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  hisilicon,power-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      System controller that holds the extra bit enabling the receiver.

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    ir@1000 {
        compatible = "hisilicon,hix5hd2-ir";
        reg = <0x1000 0x1000>;
        interrupts = <0 47 4>;
        clocks = <&clock 35>;
        hisilicon,power-syscon = <&sysctrl>;
        linux,rc-map-name = "rc-rc6-mce";
    };
