%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/hisilicon,hi3716cv200-smp-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3716CV200 per-CPU SP804 local timers

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  Hi3716CV200 has no usable Cortex-A9 local timer: neither the private timer and
  watchdog block nor the global timer in the A9 MPCore private region counts, so
  the per-CPU clock events come from dedicated SP804 channels -- cell 4 for the
  first CPU and cell 6 for the second, each with its own interrupt line.

  These channels are separate from the arm,sp804 node that provides the
  clocksource and the broadcast clock event, which remains the fallback for a
  CPU with no channel of its own.

properties:
  compatible:
    const: hisilicon,hi3716cv200-smp-timer

  reg:
    minItems: 1
    maxItems: 8
    description:
      One entry per CPU, listed in CPU order; each is that CPU's SP804 channel.

  interrupts:
    minItems: 1
    maxItems: 8
    description:
      One entry per CPU, in the same order as reg.

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    timer@f8a2a000 {
        compatible = "hisilicon,hi3716cv200-smp-timer";
        reg = <0xf8a2a000 0x20>, <0xf8a2b000 0x20>;
        interrupts = <GIC_SPI 26 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 27 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&xtal24mhz>;
    };
