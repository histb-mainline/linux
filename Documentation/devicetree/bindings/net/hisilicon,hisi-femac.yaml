%YAML 1.2
---
$id: http://devicetree.org/schemas/net/hisilicon,hisi-femac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hisilicon Fast Ethernet MAC controller

maintainers:
  - Yang Xiwen <forbidden405@foxmail.com>

allOf:
  - $ref: ethernet-controller.yaml

properties:
  compatible:
    items:
      - enum:
          - hisilicon,hi3798mv200-femac
      - const: hisilicon,hisi-femac

  reg:
    items:
      - description: The first region is the MAC core register base and size.
      - description: The second region is the global MAC control register.

  ranges:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: mac
      - const: macif
      - const: phy

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: mac
      - const: phy

  hisilicon,phy-reset-delays-us:
    items:
      - description: The 1st cell is reset pre-delay in micro seconds.
      - description: The 2nd cell is reset pulse in micro seconds.
      - description: The 3rd cell is reset post-delay in micro seconds.

patternProperties:
  '^mdio@[0-9a-f]+$':
    $ref: hisilicon,hisi-femac-mdio.yaml#

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - phy-connection-type
  - phy-handle
  - hisilicon,phy-reset-delays-us

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    ethernet@9c30000 {
        compatible = "hisilicon,hi3798mv200-femac", "hisilicon,hisi-femac";
        reg = <0x9c30000 0x1000>, <0x9c31300 0x200>;
        ranges = <0x0 0x9c30000 0x10000>;
        #address-cells = <1>;
        #size-cells = <1>;
        interrupts = <GIC_SPI 72 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk_femac>,
                 <&clk_femacif>,
                 <&clk_fephy>;
        clock-names = "mac", "macif", "phy";
        resets = <&crg 0xd0 3>, <&crg 0x388 4>;
        reset-names = "mac", "phy";
        phy-handle = <&fephy>;
        phy-connection-type = "mii";
        // To be filled by bootloader
        mac-address = [00 00 00 00 00 00];
        hisilicon,phy-reset-delays-us = <10000 10000 500000>;
        status = "okay";

        mdio@1100 {
            compatible = "hisilicon,hisi-femac-mdio";
            reg = <0x1100 0x20>;
            #address-cells = <1>;
            #size-cells = <0>;
            status = "okay";

            ethernet-phy@1 {
                reg = <1>;
                #phy-cells = <0>;
            };
        };
    };
