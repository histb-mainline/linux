%YAML 1.2
---
$id: http://devicetree.org/schemas/net/hisilicon,hisi-femac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hisilicon Fast Ethernet MAC controller

maintainers:
  - Yang Xiwen <forbidden405@foxmail.com>

allOf:
  - $ref: ethernet-controller.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: hisilicon,hisi-femac
    then:
      required:
        - clock-names
        - phy-connection-type
        - phy-handle
      properties:
        clocks:
          minItems: 3

description: |
  The FEMAC core has one register window for the MAC itself and a second one
  for the global MAC control. hi3798mv200 wires three clocks to it and names
  them, and its MDIO bus is a child node the MAC driver populates. Earlier
  members of the family (hisi-femac-v1/-v2, hi3516cv300) name no clocks at all
  and keep the MDIO bus in a sibling node, which the bus driver binds to
  directly; their clock cell stays unnamed there because the block has a single
  clock.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - hisilicon,hi3798mv200-femac
          - const: hisilicon,hisi-femac
      - enum:
          - hisilicon,hisi-femac-v1
          - hisilicon,hisi-femac-v2
          - hisilicon,hi3516cv300-femac

  reg:
    items:
      - description: The first region is the MAC core register base and size.
      - description: The second region is the global MAC control register.

  ranges:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 3

  clock-names:
    minItems: 1
    items:
      - const: mac
      - const: macif
      - const: phy

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: mac
      - const: phy

  hisilicon,phy-reset-delays-us:
    items:
      - description: The 1st cell is reset pre-delay in micro seconds.
      - description: The 2nd cell is reset pulse in micro seconds.
      - description: The 3rd cell is reset post-delay in micro seconds.

patternProperties:
  '^mdio@[0-9a-f]+$':
    $ref: hisilicon,hisi-femac-mdio.yaml#

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - hisilicon,phy-reset-delays-us

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    ethernet@9c30000 {
        compatible = "hisilicon,hi3798mv200-femac", "hisilicon,hisi-femac";
        reg = <0x9c30000 0x1000>, <0x9c31300 0x200>;
        ranges = <0x0 0x9c30000 0x10000>;
        #address-cells = <1>;
        #size-cells = <1>;
        interrupts = <GIC_SPI 72 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk_femac>,
                 <&clk_femacif>,
                 <&clk_fephy>;
        clock-names = "mac", "macif", "phy";
        resets = <&crg 0xd0 3>, <&crg 0x388 4>;
        reset-names = "mac", "phy";
        phy-handle = <&fephy>;
        phy-connection-type = "mii";
        // To be filled by bootloader
        mac-address = [00 00 00 00 00 00];
        hisilicon,phy-reset-delays-us = <10000 10000 500000>;
        status = "okay";

        mdio@1100 {
            compatible = "hisilicon,hisi-femac-mdio";
            reg = <0x1100 0x20>;
            #address-cells = <1>;
            #size-cells = <0>;
            status = "okay";

            ethernet-phy@1 {
                reg = <1>;
            };
        };
    };

  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    ethernet@9840000 {
        compatible = "hisilicon,hisi-femac-v2";
        reg = <0x9840000 0x1000>, <0x9841300 0x200>;
        interrupts = <GIC_SPI 71 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&crg 12>;
        resets = <&crg 0xcc 4>, <&crg 0x120 4>;
        reset-names = "mac", "phy";
        phy-handle = <&phy1>;
        phy-mode = "mii";
        hisilicon,phy-reset-delays-us = <10000 10000 20000>;
    };
