%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/hisilicon,hi3798mv100-aiao-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV100 AIAO I2S ports

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The Audio In And Out block of HiSilicon STB SoCs. Its ports generate their own
  bit and frame clocks (so the port is the I2S master) and move their ring buffer
  straight in or out of memory with an internal engine, which is why there is no
  dmas property here.

  The block carries the same register bands on every SoC of the family: the
  receive ports sit at +0x1000 and the transmit ports at +0x2000, each port
  taking 0x100 bytes, and the clock gate and soft reset sit in the same two bits
  of the peripheral CRG. Only the Hi3798MV100 has been run.

  On hi3798mv100 the HDMI-capable port is wired inside the SoC to the HDMI
  transmitter, so the codec side needs no phandle beyond the transmitter's own
  #sound-dai-cells. The receive port has no pins to sample on this board: the
  I2S pad mux is left in GPIO mode, so the receive port takes the serial stream
  of the transmit port instead, and captures at the rate that port plays at.

properties:
  compatible:
    const: hisilicon,hi3798mv100-aiao-i2s

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: |
      Level interrupt reporting the port's buffer conditions (watermarks,
      trans_finish per TX_TRANS_SIZE bytes, overrun/underrun). Optional because
      the driver times its period boundaries itself: the trans_finish interrupt
      does not fire for a period-sized TX_TRANS_SIZE on the silicon this was
      tested on.

  clocks:
    maxItems: 1
    description: The block clock gate (PERI_CRG70 bit 0).

  resets:
    maxItems: 1
    description: The block soft reset (PERI_CRG70 bit 4).

  '#sound-dai-cells':
    const: 1
    description:
      The index of the port inside the block, counted in the order the driver
      registers its DAIs. Port 0 is the I2S transmit port wired to the HDMI
      transmitter, port 1 the receive port that taps it.

required:
  - compatible
  - reg
  - clocks
  - resets
  - '#sound-dai-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/hisilicon,hi3798mv100-crg.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    audio@8cd0000 {
        compatible = "hisilicon,hi3798mv100-aiao-i2s";
        reg = <0x8cd0000 0x10000>;
        interrupts = <GIC_SPI 84 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&crg HI3798MV100_AIAO_CLK>;
        resets = <&crg 0x118 4>;
        #sound-dai-cells = <1>;
    };
