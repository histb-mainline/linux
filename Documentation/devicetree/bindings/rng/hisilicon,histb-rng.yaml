%YAML 1.2
---
$id: http://devicetree.org/schemas/rng/hisilicon,histb-rng.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon STB true random number generator

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The TRNG block of HiSilicon STB SoCs. It exposes three registers -- a control
  word that starts the post processor and sets its depth, a data word, and a
  status word whose low bits count how many words are ready. The block has no
  gate of its own in the CRG: on hi3798mv100 it shares the SHA engine's clock
  gate and soft reset (PERI CRG register +0xc4, bits 0 and 4), which the boot
  loader leaves enabled, so reading the block needs no clocks or resets
  property.

properties:
  compatible:
    const: hisilicon,histb-rng

  reg:
    maxItems: 1
    description:
      The three registers, so the entry starts at the control word. On
      hi3798mv100 the control word sits at the base of the enclosing 4 KiB TRNG
      window at 0xf8005000.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    rng@8005000 {
        compatible = "hisilicon,histb-rng";
        reg = <0x8005000 0x1000>;
    };
